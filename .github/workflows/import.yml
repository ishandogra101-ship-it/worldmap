name: Import from Wikidata

# The environment this repo is usually edited from cannot reach
# query.wikidata.org — the network policy answers 403 to CONNECT. Runners can,
# so the import runs here and commits its output back to the branch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = report what Wikidata returns; full = build and commit the dataset"
        type: choice
        options: [probe, full]
        default: probe
      commit:
        description: "Commit the generated data (full mode only)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wikidata-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe Wikidata
        if: inputs.mode == 'probe'
        run: node scripts/import/probe.mjs

      # One step per layer, each writing its own file as it finishes, and each
      # allowed to fail without taking the others with it. The first full run
      # lost 39 minutes of finished rulers and figures because a third layer
      # was still going when the job was killed.
      - name: Rulers
        if: inputs.mode == 'full'
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/import/build-dataset.mjs rulers

      - name: Figures
        if: inputs.mode == 'full'
        continue-on-error: true
        timeout-minutes: 60
        run: node scripts/import/build-dataset.mjs figures

      - name: Events
        if: inputs.mode == 'full'
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/import/build-dataset.mjs events

      - name: Portraits
        if: inputs.mode == 'full'
        continue-on-error: true
        timeout-minutes: 35
        run: node scripts/import/build-dataset.mjs portraits

      - name: Report what was written
        if: inputs.mode == 'full'
        run: |
          du -sh public/portraits 2>/dev/null || true
          ls -la public/data/*.json
          node -e '
            const fs = require("fs");
            for (const f of ["rulers", "figures", "events"]) {
              const p = `public/data/${f}.json`;
              if (!fs.existsSync(p)) { console.log(`${f}: missing`); continue; }
              const d = JSON.parse(fs.readFileSync(p, "utf8"));
              console.log(`${f}: ${d.length} records, ${(fs.statSync(p).size/1024).toFixed(0)} kB`);
              console.log("  sample:", JSON.stringify(d.slice(0, 2)));
            }
          '

      - name: Commit
        if: inputs.mode == 'full' && inputs.commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data public/portraits CREDITS.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Import people and events from Wikidata

          Generated by .github/workflows/import.yml. Every record keeps its
          Wikidata QID as its id and its item page as its source."
          # The import takes tens of minutes and the branch usually moves under
          # it; rebase rather than fail on a push that is merely behind.
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1

  # GitHub deliberately does not fire workflows from a push made with the
  # default GITHUB_TOKEN, so the deploy workflow's push trigger never sees the
  # commit above. Without this the data would land in the repo and the live site
  # would keep serving the old build until somebody pushed by hand.
  deploy:
    needs: import
    if: inputs.mode == 'full' && inputs.commit
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /worldmap/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: deploy
    if: inputs.mode == 'full' && inputs.commit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
